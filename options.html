<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackout 설정</title><link rel="stylesheet" href="ui.css"></head><body><main class="options"><h1>Blackout for YouTube</h1><p class="muted">모든 설정은 이 브라우저에만 저장됩니다.</p><section><h2>검열 방식</h2><select id="mode"><option value="blackout">검은색</option><option value="blur">블러</option><option value="image">사용자 이미지</option><option value="hide">완전 숨김</option></select></section><section><h2>사용자 지정 이미지</h2><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><div id="preview" class="preview">이미지 없음</div><button id="removeImage">이미지 제거</button></section><section><h2>차단 목록</h2><form id="addForm" class="inline"><input id="channel" placeholder="/@handle 또는 /channel/UC..." autocomplete="off"><button class="primary">추가</button></form><div id="list"></div></section><section><h2>백업</h2><div class="inline"><button id="export">JSON 내보내기</button><label class="buttonLike">JSON 가져오기<input id="import" type="file" accept="application/json" hidden></label></div></section></main><script src="options.js"></script></body></html>
